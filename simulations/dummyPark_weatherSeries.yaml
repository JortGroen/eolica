simulation_name: 'dummy_simulation'
park_config: 'parks/alkmaar.yaml'
model_type: 'Bastankhah_PorteAgel_2014'
model_parameters: {k: 0.0324555, TI: 0.0}
simulation:
  type: 'wind_series' ## options are 'wind_series', ...
  #file: 'input_data/tawes_gaenserndorf_mistelbach_20230101T0000_20231231T0000.csv' ## required
  #selection: {'station': 134} ## optional. set to None otherwise
  #range: {'start': '2023-01-30 01:00', 'end': '2023-02-03 23:50'} ## if this is None, it will take the full range of the input file
  file: 'input_data/wind_2019_hourly_48-48p3_16-16p3.csv' ## required
  selection: {'latitude': 48.25, 'longitude': 16.0} ## optional. set to None otherwise
  features: {'time': 'valid_time', 'wu': 'u100', 'wv': 'v100'} ## required
  range: {'start': '2019-01-30 01:00:00', 'end': '2019-02-03 23:50:00'} ## if this is None, it will take the full range of the input file
